{% load static %}
<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema — Dulceras{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { theme: { extend: { colors: { cream:'#FDF6EC','cream-2':'#F6EAD6',pink:'#F0A0C4','pink-deep':'#E285AF',brown:'#3A2417','brown-soft':'#5A3B29' }, fontFamily: { fraunces:['"Fraunces"','Georgia','serif'], poppins:['"Poppins"','system-ui','sans-serif'] } } } }</script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/app.js' %}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    body { font-family: 'Poppins', system-ui, sans-serif; background: #1A0F09; color: #D8C4AC; }
    .sa-link { display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-size:0.875rem;font-weight:500;color:#D8C4AC;text-decoration:none;transition:all 0.15s; }
    .sa-link:hover, .sa-link.active { background:rgba(240,160,196,0.15);color:#E285AF; }
    .sa-link.active { font-weight:600; }
    .sa-card { background:rgba(255,255,255,0.04);border-radius:16px;padding:20px;border:1px solid rgba(255,255,255,0.06); }
    .sa-table { width:100%;border-collapse:collapse; }
    .sa-table th { padding:10px 14px;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#D8C4AC;text-align:left;border-bottom:1px solid rgba(255,255,255,0.06); }
    .sa-table td { padding:12px 14px;font-size:0.875rem;color:#D8C4AC;border-bottom:1px solid rgba(255,255,255,0.04); }
    .sa-table tr:hover td { background:rgba(255,255,255,0.03); }
  </style>
</head>
<body x-data x-init="if (!$store.adminAuth.isLoggedIn || $store.adminAuth.role !== 'superadmin') window.location.href='/admin/login/'">

<script>window.DULCERAS = { apiBase: '' }</script>

<div class="flex h-screen overflow-hidden" x-show="$store.adminAuth.isLoggedIn && $store.adminAuth.role === 'superadmin'">

  <!-- Sidebar -->
  <aside class="hidden md:flex flex-col flex-shrink-0" style="width:220px;background:rgba(0,0,0,0.3);border-right:1px solid rgba(255,255,255,0.06)">
    <div class="p-5 flex items-center gap-2" style="border-bottom:1px solid rgba(255,255,255,0.06)">
      <img src="{% static 'brand/logo-icon.png' %}" alt="" style="height:28px;width:auto;filter:brightness(0) invert(1)">
      <span class="font-fraunces font-bold text-white text-sm">Sistema</span>
    </div>
    <nav class="flex-1 p-3 space-y-0.5">
      <a href="/superadmin/" class="sa-link {% block nav_system %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Registros técnicos
      </a>
      <a href="/admin/dashboard/" class="sa-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Volver al panel
      </a>
    </nav>
    <div class="p-3" style="border-top:1px solid rgba(255,255,255,0.06)">
      <div class="flex items-center gap-2 p-2">
        <div class="flex items-center justify-center rounded-full font-semibold text-white text-xs flex-shrink-0"
             style="width:30px;height:30px;background:linear-gradient(135deg,#F0A0C4,#E285AF)">
          <span x-text="($store.adminAuth.username ?? 'S')[0].toUpperCase()"></span>
        </div>
        <span class="text-sm font-medium truncate flex-1" style="color:#D8C4AC" x-text="$store.adminAuth.username ?? ''"></span>
        <button @click="$store.adminAuth.logout()" style="background:none;border:none;cursor:pointer;color:#D8C4AC;opacity:.5" onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto">
    <div class="sticky top-0 z-10 flex items-center justify-between px-6 py-4" style="background:rgba(0,0,0,0.4);border-bottom:1px solid rgba(255,255,255,0.06)">
      <h1 class="font-fraunces font-bold text-white" style="font-size:1.1rem">{% block page_title %}Sistema{% endblock %}</h1>
    </div>
    <div class="p-6">{% block page_content %}{% endblock %}</div>
  </main>
</div>
</body>
</html>
