{% load static %}
<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Panel — Dulceras Team{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Anti-FOUC: aplica dark antes de que Alpine cargue -->
  <script>if (localStorage.getItem('admin_dark') === '1') document.documentElement.classList.add('dark')</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cream: '#FDF6EC', 'cream-2': '#F6EAD6',
            pink: '#F0A0C4', 'pink-deep': '#E285AF',
            brown: '#3A2417', 'brown-soft': '#5A3B29',
          },
          fontFamily: {
            fraunces: ['"Fraunces"', 'Georgia', 'serif'],
            poppins:  ['"Poppins"', 'system-ui', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <script src="{% static 'js/app.js' %}"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    /* ── Variables de dark mode ─────────────────────────────────────────── */
    :root {
      --dm-bg:      #101014;
      --dm-surface: #1c1c20;
      --dm-lift:    #28282e;
      --dm-border:  rgba(255,255,255,0.07);
      --dm-text:    #e4e4ea;
      --dm-soft:    #88889a;
    }

    /* ── Estilos base ───────────────────────────────────────────────────── */
    body { font-family: 'Poppins', system-ui, sans-serif; background: #F5F5F5; }
    .sidebar-link { display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-size:0.875rem;font-weight:500;color:#5A3B29;text-decoration:none;transition:all 0.15s; }
    .sidebar-link:hover, .sidebar-link.active { background:rgba(240,160,196,0.18);color:#E285AF; }
    .sidebar-link.active { font-weight:600; }
    .stat-card { background:#fff;border-radius:16px;padding:20px;border:1px solid rgba(58,36,23,0.07);box-shadow:0 2px 12px rgba(58,36,23,0.05); }
    .data-table { width:100%;border-collapse:collapse; }
    .data-table th { padding:10px 14px;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#5A3B29;text-align:left;border-bottom:1px solid rgba(58,36,23,0.1); }
    .data-table td { padding:12px 14px;font-size:0.875rem;color:#3A2417;border-bottom:1px solid rgba(58,36,23,0.06); }
    .data-table tr:hover td { background:rgba(253,246,236,0.6); }
    .badge { display:inline-flex;align-items:center;font-size:0.7rem;font-weight:600;padding:3px 10px;border-radius:100px; }
    .badge-pink   { background:rgba(240,160,196,0.25);color:#C25D8A; }
    .badge-green  { background:rgba(39,174,96,0.12);color:#1E8449; }
    .badge-blue   { background:rgba(41,128,185,0.12);color:#2471A3; }
    .badge-grey   { background:rgba(58,36,23,0.08);color:#5A3B29; }
    .badge-red    { background:rgba(231,76,60,0.12);color:#C0392B; }
    .badge-purple { background:rgba(155,89,182,0.15);color:#7D3C98; }
    .badge-yellow { background:rgba(212,172,13,0.18);color:#9A7D0A; }
    .badge-orange { background:rgba(230,126,34,0.15);color:#CA6F1E; }

    /* ── Dark mode ──────────────────────────────────────────────────────── */
    html.dark body { background: var(--dm-bg) !important; color: var(--dm-text); }

    /* Sidebar */
    html.dark aside { background: var(--dm-surface) !important; border-right-color: var(--dm-border) !important; }
    html.dark aside > div { border-color: var(--dm-border) !important; }
    html.dark .sidebar-link { color: var(--dm-soft) !important; }
    html.dark .sidebar-link:hover,
    html.dark .sidebar-link.active { background: rgba(226,133,175,0.12) !important; color: #E285AF !important; }

    /* Top bar */
    html.dark .dm-topbar { background: var(--dm-surface) !important; border-bottom-color: var(--dm-border) !important; }

    /* Cards */
    html.dark .stat-card { background: var(--dm-surface) !important; border-color: var(--dm-border) !important; box-shadow: 0 2px 8px rgba(0,0,0,0.4) !important; }
    html.dark .bg-white  { background: var(--dm-surface) !important; }
    html.dark [style*="background:#fff"] { background: var(--dm-surface) !important; }

    /* Texto */
    html.dark .text-brown      { color: var(--dm-text) !important; }
    html.dark .text-brown-soft { color: var(--dm-soft) !important; }

    /* Tablas */
    html.dark .data-table th           { color: var(--dm-soft) !important; border-bottom-color: var(--dm-border) !important; }
    html.dark .data-table td           { color: var(--dm-text) !important; border-bottom-color: rgba(255,255,255,0.04) !important; }
    html.dark .data-table tr:hover td  { background: rgba(255,255,255,0.04) !important; }

    /* Badges */
    html.dark .badge-grey { background: rgba(255,255,255,0.07) !important; color: var(--dm-soft) !important; }

    /* Botón toggle */
    html.dark .dm-toggle { background: rgba(255,255,255,0.06) !important; color: var(--dm-soft) !important; }
    html.dark .dm-toggle:hover { background: rgba(255,255,255,0.1) !important; }
    /* Íconos luna/sol — CSS puro, sin depender de Alpine */
    .dm-icon-moon { display: block; }
    .dm-icon-sun  { display: none; }
    html.dark .dm-icon-moon { display: none; }
    html.dark .dm-icon-sun  { display: block; }

    /* Inputs / selects en dark */
    html.dark input, html.dark select, html.dark textarea {
      background: var(--dm-lift) !important;
      border-color: var(--dm-border) !important;
      color: var(--dm-text) !important;
    }
    html.dark input::placeholder, html.dark textarea::placeholder { color: var(--dm-soft) !important; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body x-data x-init="if (!$store.adminAuth.isLoggedIn && !window.location.pathname.includes('login')) window.location.href='/admin/login/'">

<script>window.DULCERAS = { apiBase: '' }</script>

<div class="flex h-screen overflow-hidden" x-show="$store.adminAuth.isLoggedIn">

  <!-- Sidebar -->
  <aside class="hidden md:flex flex-col flex-shrink-0" style="width:220px;background:#fff;border-right:1px solid rgba(58,36,23,0.08)">
    <!-- Logo -->
    <div class="py-3 flex justify-center items-center" style="border-bottom:1px solid rgba(58,36,23,0.08)">
      <img src="{% static 'brand/logo-icon.png' %}" alt="Dulceras Team" style="height:64px;width:auto">
    </div>

    <!-- Nav -->
    <nav class="flex-1 p-3 space-y-0.5 overflow-y-auto">
      <a href="/admin/dashboard/"  class="sidebar-link {% block nav_dashboard  %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/admin/orders/"    class="sidebar-link {% block nav_orders     %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Pedidos
      </a>
      <a href="/admin/customers/" class="sidebar-link {% block nav_customers  %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clientes
      </a>
      <a href="/admin/catalog/"   class="sidebar-link {% block nav_catalog    %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>
        Catálogo
      </a>
      <a href="/admin/calendar/"  class="sidebar-link {% block nav_calendar   %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Calendario
      </a>
      <a href="/admin/coupons/"   class="sidebar-link {% block nav_coupons    %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        Cupones
      </a>
      <a href="/admin/reviews/"   class="sidebar-link {% block nav_reviews    %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        Reseñas
      </a>
      <a href="/admin/reports/"   class="sidebar-link {% block nav_reports    %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Reportes
      </a>
      <a href="/admin/settings/"  class="sidebar-link {% block nav_settings   %}{% endblock %}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Configuración
      </a>
      <a href="/superadmin/" x-show="$store.adminAuth.role === 'superadmin'" class="sidebar-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        Sistema
      </a>
    </nav>

    <!-- User + logout -->
    <div class="p-3" style="border-top:1px solid rgba(58,36,23,0.08)">
      <div class="flex items-center gap-2 p-2">
        <div class="flex items-center justify-center rounded-full font-semibold text-white text-xs flex-shrink-0"
             style="width:30px;height:30px;background:linear-gradient(135deg,#F0A0C4,#E285AF)">
          <span x-text="($store.adminAuth.username ?? 'A')[0].toUpperCase()"></span>
        </div>
        <span class="text-sm font-medium text-brown truncate flex-1" x-text="$store.adminAuth.username ?? ''"></span>
        <button @click="$store.adminAuth.logout()" title="Cerrar sesión"
                style="background:none;border:none;cursor:pointer;color:#5A3B29;opacity:.5"
                onmouseenter="this.style.opacity=1" onmouseleave="this.style.opacity=.5">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <!-- Top bar -->
    <div class="dm-topbar sticky top-0 z-10 flex items-center justify-between px-6 py-4"
         style="background:#fff;border-bottom:1px solid rgba(58,36,23,0.08)">
      <h1 class="font-fraunces font-bold text-brown" style="font-size:1.15rem">{% block page_title %}Panel{% endblock %}</h1>
      <div class="flex items-center gap-3">
        <a href="/" target="_blank" class="text-xs text-brown-soft no-underline hover:underline">Ver tienda →</a>

        <!-- Toggle dark mode -->
        <button id="dm-toggle-btn" onclick="dtToggleDark()"
                class="dm-toggle flex items-center justify-center rounded-full"
                title="Modo oscuro / claro"
                style="width:36px;height:36px;background:rgba(58,36,23,0.06);border:none;cursor:pointer;color:#5A3B29;flex-shrink:0">
          <!-- Luna — visible en modo claro (CSS la oculta en dark) -->
          <svg class="dm-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <!-- Sol — visible en modo oscuro (CSS la oculta en light) -->
          <svg class="dm-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <script>
          function dtToggleDark() {
            var isDark = document.documentElement.classList.toggle('dark')
            localStorage.setItem('admin_dark', isDark ? '1' : '0')
            if (window.Alpine) Alpine.store('darkMode').enabled = isDark
          }
        </script>

        <div class="hidden md:block text-sm font-medium text-brown-soft" x-text="$store.adminAuth.username ?? ''"></div>
      </div>
    </div>

    <!-- Page content -->
    <div class="p-6">
      {% block page_content %}{% endblock %}
    </div>
  </main>
</div>

</body>
</html>
