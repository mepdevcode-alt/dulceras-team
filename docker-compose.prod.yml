# Producción en el VPS: Django (gunicorn) + n8n.
# Los dos puertos escuchan solo en 127.0.0.1: nginx (CloudPanel) hace proxy a 8001
# y el editor de n8n se abre por túnel SSH. Ver docker/README.md.
#
#   docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        format: raw   # sin interpolar: el SECRET_KEY puede tener '$'
    environment:
      # SQLite y media viven en el host (./data, ./media), no dentro del contenedor.
      # Con DB_ENGINE=mssql en el .env, settings ignora esta URL y usa SQL Server;
      # sacarlo del .env vuelve a SQLite (rollback).
      DATABASE_URL: sqlite:////app/data/db.sqlite3
      RUN_SEED: "false"
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    depends_on:
      n8n:
        condition: service_started
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    # Pide >= 2 GB de RAM en el host: no levantar en un VPS de 2 GB.
    env_file:
      - path: .env.sqlserver   # MSSQL_SA_PASSWORD (no versionado)
        format: raw
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_MEMORY_LIMIT_MB: "2048"
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "127.0.0.1:1433:1433"   # solo para sqlcmd / túnel SSH; nunca 0.0.0.0
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  n8n:
    image: n8nio/n8n:latest   # Docker Hub (pasa por el mirror del daemon)
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"   # nunca exponer en 0.0.0.0
    environment:
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      TZ: America/Argentina/Buenos_Aires
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://127.0.0.1:5678/
      # El editor se abre por túnel SSH en http://localhost, sin HTTPS.
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
  sqlserver_data:
